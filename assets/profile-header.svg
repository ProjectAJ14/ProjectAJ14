<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ajay Kumar — Full-stack engineer</title>
  <desc id="desc">From the first screen to the last mile. A connected path across web, backend, data, cloud and mobile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E2C"/>
      <stop offset="1" stop-color="#08121C"/>
    </linearGradient>
    <linearGradient id="line" x1="65" y1="0" x2="1135" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6DE3C2"/>
      <stop offset="0.65" stop-color="#76B9FF"/>
      <stop offset="1" stop-color="#FFA68A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
